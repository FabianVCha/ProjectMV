---
# ConfigMap pod-A: gateway principal con Telegram y agentes planner/researcher/coder
apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-pod-a-config
  namespace: fabian-morgan
data:
  openclaw.json: |
    {
      "gateway": {
        "mode": "local",
        "bind": "loopback",
        "port": 18789,
        "auth": {
          "mode": "token"
        },
        "controlUi": {
          "enabled": true
        }
      },
      "agents": {
        "defaults": {
          "workspace": "~/.openclaw/workspace",
          "models": {
            "opencode-go/kimi-k2.6": {}
          },
          "model": {
            "primary": "opencode-go/kimi-k2.6"
          }
        },
        "list": [
          {
            "id": "planner",
            "name": "Planner",
            "workspace": "~/.openclaw/agents/planner/workspace"
          },
          {
            "id": "researcher",
            "name": "Researcher",
            "workspace": "~/.openclaw/agents/researcher/workspace"
          },
          {
            "id": "coder",
            "name": "Coder",
            "workspace": "~/.openclaw/agents/coder/workspace"
          }
        ]
      },
      "cron": {
        "enabled": false
      },
      "plugins": {
        "entries": {
          "opencode-go": {
            "enabled": true
          },
          "telegram": {
            "enabled": true
          }
        }
      },
      "auth": {
        "profiles": {
          "opencode-go:default": {
            "provider": "opencode-go",
            "mode": "api_key"
          }
        }
      },
      "channels": {
        "telegram": {
          "enabled": true,
          "groups": {
            "*": {
              "requireMention": true
            }
          }
        }
      },
      "meta": {
        "lastTouchedVersion": "2026.5.19",
        "lastTouchedAt": "2026-05-21T03:59:57.264Z"
      }
    }
  AGENTS.md: |
    # OpenClaw - Usuario 1 - Gateway Principal

    Eres el asistente principal del usuario. Coordinas tareas entre agentes especializados.

    ## Agentes disponibles
    - **Planner**: planifica y descompone tareas complejas
    - **Researcher**: busca y analiza información
    - **Coder**: implementa y revisa código

---
# ConfigMap pod-B: sub-agente externo con Discord
# bind: lan para que sea accesible desde pod-A via Service interno
apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-pod-b-config
  namespace: fabian-morgan
data:
  openclaw.json: |
    {
      "gateway": {
        "mode": "local",
        "bind": "lan",
        "port": 18789,
        "auth": {
          "mode": "token"
        },
        "controlUi": {
          "enabled": true
        }
      },
      "agents": {
        "defaults": {
          "workspace": "~/.openclaw/workspace",
          "models": {
            "opencode-go/kimi-k2.6": {}
          },
          "model": {
            "primary": "opencode-go/kimi-k2.6"
          }
        },
        "list": [
          {
            "id": "external",
            "name": "External Agent",
            "workspace": "~/.openclaw/workspace"
          }
        ]
      },
      "cron": {
        "enabled": false
      },
      "plugins": {
        "entries": {
          "opencode-go": {
            "enabled": true
          },
          "discord": {
            "enabled": true
          }
        }
      },
      "auth": {
        "profiles": {
          "opencode-go:default": {
            "provider": "opencode-go",
            "mode": "api_key"
          }
        }
      },
      "channels": {
        "discord": {
          "enabled": true
        }
      },
      "meta": {
        "lastTouchedVersion": "2026.5.19",
        "lastTouchedAt": "2026-05-21T03:59:57.264Z"
      }
    }
  AGENTS.md: |
    # OpenClaw - Usuario 1 - Sub-agente Externo

    Eres un agente especializado accesible desde Discord.
    Puedes recibir delegaciones del gateway principal.
