---
# PVC pod-A andres-vim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openclaw-pod-a-home
  namespace: andres-vim
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClass: local-path

---
# PVC pod-B andres-vim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openclaw-pod-b-home
  namespace: andres-vim
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClass: local-path

---
# Deployment pod-A andres-vim
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw-pod-a
  namespace: andres-vim
  labels:
    app: openclaw-pod-a
    usuario: andres-vim
    role: gateway-principal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openclaw-pod-a
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: openclaw-pod-a
        usuario: andres-vim
        role: gateway-principal
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: install-brew
          image: ghcr.io/openclaw/openclaw:latest
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - |
              if [ ! -x /home/node/.openclaw/homebrew/bin/brew ]; then
                apt-get update && apt-get install -y build-essential curl file git procps
                HOMEBREW_PREFIX=/home/node/.openclaw/homebrew
                mkdir -p $HOMEBREW_PREFIX
                git clone https://github.com/Homebrew/brew $HOMEBREW_PREFIX
                chown -R 1000:1000 $HOMEBREW_PREFIX
              else
                echo "Homebrew already installed, skipping."
              fi
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - mountPath: /home/node/.openclaw
              name: openclaw-home
        - name: fix-home-perms
          image: busybox:1.37
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - chown -R 1000:1000 /home/node/.openclaw && chmod 700 /home/node/.openclaw
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - mountPath: /home/node/.openclaw
              name: openclaw-home
        - name: init-config
          image: busybox:1.37
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              cp /config/openclaw.json /home/node/.openclaw/openclaw.json
              mkdir -p /home/node/.openclaw/workspace
              if [ -f /config/AGENTS.md ]; then
                cp /config/AGENTS.md /home/node/.openclaw/workspace/AGENTS.md
              fi
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - mountPath: /home/node/.openclaw
              name: openclaw-home
            - mountPath: /config
              name: config
      containers:
        - name: gateway
          image: ghcr.io/openclaw/openclaw:latest
          imagePullPolicy: IfNotPresent
          command:
            - node
            - /app/dist/index.js
            - gateway
            - run
          env:
            - name: HOME
              value: /home/node
            - name: OPENCLAW_CONFIG_DIR
              value: /home/node/.openclaw
            - name: NODE_ENV
              value: production
            - name: PATH
              value: /home/node/.openclaw/homebrew/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            - name: HOMEBREW_PREFIX
              value: /home/node/.openclaw/homebrew
            - name: HOMEBREW_CELLAR
              value: /home/node/.openclaw/homebrew/Cellar
            - name: HOMEBREW_REPOSITORY
              value: /home/node/.openclaw/homebrew/Homebrew
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-pod-a-secrets
                  key: OPENCLAW_GATEWAY_TOKEN
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openclaw-pod-a-secrets
                  key: GEMINI_API_KEY
                  optional: true
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openclaw-pod-a-secrets
                  key: ANTHROPIC_API_KEY
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openclaw-pod-a-secrets
                  key: OPENAI_API_KEY
                  optional: true
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openclaw-pod-a-secrets
                  key: OPENROUTER_API_KEY
                  optional: true
          ports:
            - containerPort: 18789
              name: gateway
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - "require('http').get('http://127.0.0.1:18789/readyz', r => process.exit(r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))"
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - "require('http').get('http://127.0.0.1:18789/healthz', r => process.exit(r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))"
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          volumeMounts:
            - mountPath: /home/node/.openclaw
              name: openclaw-home
            - mountPath: /tmp
              name: tmp-volume
            - mountPath: /home/node/.npm
              name: npm-cache
      volumes:
        - name: openclaw-home
          persistentVolumeClaim:
            claimName: openclaw-pod-a-home
        - name: config
          configMap:
            name: openclaw-pod-a-config
        - name: tmp-volume
          emptyDir: {}
        - name: npm-cache
          emptyDir: {}

